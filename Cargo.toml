[package]
name = "rust_gp"
version = "0.1.0"
edition = "2021"
description = "Multi-band Matérn-3/2 Gaussian-process light-curve fitter using an exact O(n) Kalman likelihood and L-BFGS"

[lib]
name = "rust_gp"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3"]

[dependencies]
csv = "1.3"
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "fit-bench"
path = "src/bin/fit_bench.rs"

[[bin]]
name = "likelihood-bench"
path = "src/bin/likelihood_bench.rs"

[profile.release]
lto = "fat"
codegen-units = 1
